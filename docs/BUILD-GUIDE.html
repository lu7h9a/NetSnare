<section class="tab">
<h2>What NetWraith Is</h2>
<div class="card">
<p><strong>NetWraith is a packet sniffer and intrusion detector for Linux, written in plain Python 3 with no frameworks</strong> — no Scapy, no Flask, no external libraries. It opens a raw socket, decodes Ethernet, IPv4, TCP and UDP headers byte-by-byte with <code>struct.unpack</code>, runs four independent detection algorithms over the decoded packets, writes alerts to <code>alerts.json</code>, and shows them live on an HTML dashboard.</p>
<p><strong>The problem it solves:</strong> most people meet networking through libraries that hide the bytes (Scapy, Wireshark dissectors, pandas). NetWraith goes the other way — every field, from the Ethernet MAC bytes to a single TCP flag bit, is read by hand so the author can explain exactly what a "port scan" or "SYN flood" looks like at the wire level, not just name them.</p>
<p><strong>Why a defence lab would care:</strong> intrusion detection is a core capability in any SOC or CNO toolchain. A reviewer isn't looking for a product that beats Snort — they're looking for someone who understands TCP/IP well enough to write the detection logic themselves, reason about its false-positive/false-negative trade-offs, and say honestly where it breaks. That's exactly what this project demonstrates and documents.</p>
</div>
<h3>At a glance</h3>
<table>
<tr><th>Stack</th><td>Python 3.14 standard library only — <code>socket</code>, <code>struct</code>, <code>json</code>, <code>collections</code>, <code>time</code></td></tr>
<tr><th>Capture</th><td><code>AF_PACKET</code>/<code>SOCK_RAW</code> socket, manual Ethernet/IPv4/TCP/UDP decoding</td></tr>
<tr><th>Detection</th><td>4 independent detectors: fast port scan, slow (bucketed) port scan, distributed port scan, SYN flood</td></tr>
<tr><th>Output</th><td><code>alerts.json</code> (atomic writes) + <code>packets.jsonl</code> raw log</td></tr>
<tr><th>Dashboard</th><td><code>dashboard.html</code>, polls every 2s, light/dark theme, served with <code>python3 -m http.server</code></td></tr>
<tr><th>Tested on</th><td>Kali Linux, kernel 6.19.14-kali-amd64, Python 3.14.7, loopback (<code>127.0.0.1</code>) as the lab target</td></tr>
</table>
</section>

<div class="note"><strong>Why four detectors, not one?</strong> A single fixed window/threshold detector always has a blind spot — attackers who go slower than the window, or spread across many source IPs, slip through. NetWraith runs a fast-window scan detector (catches nmap's default speed), a bucketed slow-scan detector (catches a patient single attacker), a distributed-scan detector (catches many attackers each staying under the radar individually, grouped by <em>victim</em> instead of attacker), and a SYN-flood detector keyed per-service and globally (catches both a real flood from one IP and a spoofed flood from thousands of fake IPs). Each one's exact rule and trade-off is in <strong>Testing &amp; Results</strong>.</div>

<section class="tab">
<h2>Build Steps</h2>
<p class="small">Every step below was actually typed and run on the author's own machine (Kali, kernel 6.19.14, Python 3.14.7) against loopback traffic and the author's own VirtualBox lab network. See <strong>Testing &amp; Results</strong> for the real numbers each step produced.</p>

<div class="card">
<h3>Step 1 — Read the TCP handshake in Wireshark</h3>
<p><strong>Goal:</strong> understand SYN / SYN-ACK / ACK before writing a single line of code.</p>
<p><strong>Command:</strong></p>
<pre>sudo tshark -i wlan0 -f "tcp port 80" -c 12</pre>
<p><strong>What we saw:</strong> a real capture against <code>example.com</code> over both IPv6 and IPv4, showing the 3-way handshake, the HTTP GET/response, and the 3-way-ish FIN close.</p>
</div>

<div class="card">
<h3>Step 2 — Open a raw socket</h3>
<pre>s = socket.socket(socket.AF_PACKET, socket.SOCK_RAW, socket.ntohs(0x0003))
data, addr = s.recvfrom(65535)
print(data[:14].hex(" "))</pre>
<p><strong>Real output:</strong> <code>4c 06 17 03 01 f0 60 45 2e xx xx xx 08 00</code> — the last two bytes <code>08 00</code> mean "IPv4 inside".</p>
</div>

<div class="card">
<h3>Step 3 — Decode the Ethernet header</h3>
<pre>dst, src, eth_type = struct.unpack("!6s6sH", data[:14])</pre>
<p><code>!6s6sH</code> = 6 bytes + 6 bytes + 2-byte number = 14 bytes, matching the Ethernet header size exactly.</p>
</div>

<div class="card">
<h3>Step 4 — Decode the IPv4 header</h3>
<pre>ver_ihl, tos, total_len, ident, frag, ttl, proto, csum, src_ip, dst_ip = \
    struct.unpack("!BBHHHBBH4s4s", data[14:34])
ihl = (ver_ihl & 0x0F) * 4</pre>
<p><strong>Real check:</strong> a captured SYN packet showed <code>total_len=60</code>; 60 + 14 (Ethernet) = 74, matching tshark's own frame-length column exactly.</p>
</div>

<div class="card">
<h3>Step 5 — Decode TCP and UDP</h3>
<pre>sport, dport, seq, ack, off, flags, win, tcsum, urg = \
    struct.unpack("!HHIIBBHHH", data[start:start+20])</pre>
<p>Flags are tested with bitmasks: <code>flags &amp; 0x02</code> is SYN, <code>flags &amp; 0x10</code> is ACK. A SYN-ACK is <code>0x12</code> (0x02+0x10).</p>
</div>

<div class="card">
<h3>Step 6 — <code>parse_packet()</code> and <code>packets.jsonl</code></h3>
<p>Refactored decoding into one reusable function returning a dict, written one JSON object per line via <code>json.dumps(pkt) + "\n"</code>, with <code>f.flush()</code> so the dashboard/other tools can tail it live.</p>
</div>

<div class="card">
<h3>Step 7 — Three port-scan detectors</h3>
<p><strong>7a — fast:</strong> sliding 10-second window, <code>deque</code> per source IP, alert past 20 distinct destination ports.<br>
<strong>7b — slow:</strong> 1-minute buckets, 10 kept (10-minute window), alert past 30 distinct ports from one source.<br>
<strong>7c — distributed:</strong> same bucket idea but keyed by <em>destination</em>, tracking both distinct sources and distinct ports; alert when ≥5 sources AND &gt;30 ports hit one target.</p>
<p>Each has its own fake-packet unit test file (<code>tests/test_scan.py</code>, <code>test_slow.py</code>, <code>test_distributed.py</code>) — all passing, see Testing &amp; Results.</p>
</div>

<div class="card">
<h3>Step 8 — SYN flood detector</h3>
<p>Tracks unanswered SYNs keyed by <code>(src, sport, dst, dport)</code>, with <code>Counter</code>s per-service and per-target-service for the spoofed-source case. An ACK (not RST — see Interview Kit) on the matching key clears the entry. Alerts past 100 half-open per service from one source, or 500 total per service across all sources.</p>
</div>

<div class="card">
<h3>Step 9 — Wire detectors into the live sniffer</h3>
<p>Every captured packet is handed to all four detectors; any alert is appended to an in-memory list and written to <code>alerts.json</code> via a temp-file-plus-<code>os.replace</code> atomic swap, so the dashboard never reads a half-written file.</p>
</div>

<div class="card">
<h3>Step 10 — Live dashboard</h3>
<p><code>dashboard.html</code> polls <code>alerts.json</code> every 2 seconds with <code>fetch(..., {cache:"no-store"})</code>, renders a table (newest first), and themes itself with <code>prefers-color-scheme</code> for light/dark.</p>
</div>

<div class="card">
<h3>Step 11 — Real attack testing</h3>
<p>5 bounded SYN-flood trials (<code>hping3 --flood</code> wrapped in <code>timeout 5</code>) and live nmap SYN-scan runs against the loopback target, with results pulled straight from the detector's own <code>alerts.json</code>. Full numbers in <strong>Testing &amp; Results</strong>.</p>
</div>
</section>

<section class="tab">
<h2>How It Works: One Real Run</h2>
<div class="card">
<h3>One real captured SYN packet, byte by byte</h3>
<p>Captured on this machine with <code>curl -4 http://example.com</code>, 74 bytes total:</p>
<pre>offset  bytes                                   meaning
0-5     4c 06 17 03 01 f0                       destination MAC (router)
6-11    60:45:2e:xx:xx:xx                       source MAC (masked — this machine)
12-13   08 00                                   EtherType: IPv4
14      45                                      version=4, IHL=5 (→ 20-byte header)
15      00                                       type of service
16-17   00 3c                                   total length = 60
18-19   .. ..                                    identification
20-21   .. ..                                    flags/fragment offset
22      40                                       TTL = 64
23      06                                       protocol = 6 (TCP)
24-25   .. ..                                    header checksum
26-29   c0 a8 01 07                             source IP 192.168.1.7
30-33   68 14 17 9a                             destination IP 104.20.23.154
34-35   d0 a0                                    source port 53472
36-37   00 50                                    destination port 80
38-41   .. .. .. ..                              sequence number (ISN, random 32-bit)
42-45   00 00 00 00                              ack number = 0 (none yet)
46      50                                        data offset = 5 words = 20 bytes
47      02                                        flags = 0x02 = SYN only
48-73   ...                                       window, checksum, urgent ptr, options</pre>
<p>14 (Ethernet) + 20 (IPv4, IHL×4) + 40 (TCP incl. options) = <strong>74 bytes</strong>, matching tshark's own reported frame length for the same packet exactly.</p>
</div>
<div class="card">
<h3>Why a SYN scan looks different from a SYN flood</h3>
<table>
<tr><th></th><th>Port scan</th><th>SYN flood</th></tr>
<tr><td>Goal</td><td>Find open doors (reconnaissance)</td><td>Break the server (denial of service)</td></tr>
<tr><td>Destination ports</td><td>Many different ports, usually 1 SYN each</td><td>Usually one port, hit over and over</td></tr>
<tr><td>What the detector counts</td><td>Size of the <em>set</em> of distinct ports per source</td><td>The <em>count</em> of unanswered SYNs per (source, target, port)</td></tr>
<tr><td>Observed in this project</td><td>nmap -sS, 100 ports → PORT_SCAN at port #21</td><td>hping3 --flood, 1 port → SYN_FLOOD at half-open #101</td></tr>
</table>
<p>This is exactly why a scan and a flood never both fire for the same traffic in this project's tests: a scan spreads one SYN across many ports (the per-service SYN count never gets near 100), and a flood repeats one port (the distinct-port count never gets near 20).</p>
</div>
</section>

<h2>Testing &amp; Results</h2>

<h3>Unit tests (synthetic packets — exact, repeatable)</h3>
<table>
<tr><th>File</th><th>Tests</th><th>Result</th></tr>
<tr><td><code>tests/test_scan.py</code></td><td>fast scan / one port repeated / slow trickle / SYN-ACK ignored</td><td class="pass">4/4 PASS</td></tr>
<tr><td><code>tests/test_slow.py</code></td><td>trickle caught by slow, missed by fast / 20-min trickle missed (honest) / one port repeated / buckets ≤10</td><td class="pass">5/5 PASS</td></tr>
<tr><td><code>tests/test_distributed.py</code></td><td>6×6 distributed scan caught only by new detector / 2 sources no-alert / 50 clients 1 port no-alert / buckets ≤5</td><td class="pass">6/6 PASS</td></tr>
<tr><td><code>tests/test_flood.py</code></td><td>single-source flood / spoofed flood / normal handshakes clean / scan≠flood / slow SYNs clean / memory bounded</td><td class="pass">7/7 PASS</td></tr>
</table>

<h3>Real attack: nmap SYN scan vs. the loopback target</h3>
<pre>sudo nmap -sS -p 1-100 127.0.0.1</pre>
<table>
<tr><th>Detector</th><th>Result</th></tr>
<tr><td>Fast scan detector</td><td><span class="pass">PORT_SCAN</span> fired at port #21 (window=10s)</td></tr>
<tr><td>Slow scan detector</td><td><span class="pass">SLOW_PORT_SCAN</span> also fired at port #31 (window=600s)</td></tr>
<tr><td>Flood detector</td><td>correctly silent — each port got exactly 1 SYN</td></tr>
</table>
<div class="limit"><strong>Known duplicate-alert issue:</strong> one nmap run produced <em>two</em> alerts (fast + slow both crossed their thresholds on the same scan). Both are individually correct by their own rule, but a human reading the dashboard sees 2 alerts for 1 attack. Not de-duplicated, for the honest reason that there wasn't time — documented here rather than hidden.</div>

<h3>Real attack: 5 bounded SYN-flood trials against loopback</h3>
<p class="small">Each trial: <code>sudo timeout 5 hping3 -S -p &lt;port&gt; -d &lt;size&gt; --flood 127.0.0.1</code>, sniffer running continuously throughout.</p>
<table>
<tr><th>Trial</th><th>Port</th><th>Payload</th><th>hping3 reported sent</th><th>Alert count before→after</th><th>Caught?</th></tr>
<tr><td>1</td><td>80</td><td>0 B</td><td>1,203,256</td><td>0 → 2</td><td class="pass">YES</td></tr>
<tr><td>2</td><td>80</td><td>0 B</td><td>1,277,512</td><td>6 → 8</td><td class="pass">YES</td></tr>
<tr><td>3</td><td>8080</td><td>0 B</td><td>1,235,671</td><td>8 → 10</td><td class="pass">YES</td></tr>
<tr><td>4</td><td>80</td><td>500 B</td><td>1,154,715</td><td>10 → 12</td><td class="pass">YES</td></tr>
<tr><td>5</td><td>443</td><td>0 B</td><td>1,217,648</td><td>12 → 14</td><td class="pass">YES</td></tr>
</table>
<p><strong>Result: 5/5 floods caught, 0 false alarms, 0 missed.</strong> Every trial produced exactly 2 new alerts — the initial threshold-crossing alert and one re-alert after the 5-second cool-down expired — which is consistent, explainable behaviour rather than noise.</p>

<div class="limit"><strong>Honest finding — capture loss at high rate:</strong> <code>stats.TCP</code> in <code>alerts.json</code> grew by only tens of thousands of packets per trial, while hping3 reported sending ~1.2 million SYNs each time — roughly <strong>97% packet loss</strong> at the sniffer's single-threaded <code>recvfrom()</code> loop. The detector still caught every flood, because it only needs to see a small fraction of SYNs to cross its threshold — a genuinely useful robustness property, not luck, and worth saying exactly that way in an interview.</div>

<div class="limit"><strong>Honest finding — the <code>/proc/net/dev</code> cross-check was abandoned.</strong> An attempt to verify packet counts against the kernel's own interface counters produced numbers 40-80× larger than hping3's own report, most likely because other local activity (including the author's own tooling) was also generating loopback traffic during the measurement window. Rather than report a misleading number, this check was dropped in favour of the two numbers that are independently verifiable: hping3's own send count, and the detector's own alert state.</div>

<h3>Test environment, stated plainly</h3>
<p>All attack tests above were run against <strong>127.0.0.1 (loopback)</strong> on the same machine as the sniffer, not a separate victim VM — the VirtualBox host-only lab network was planned but not completed within the project's time window. This is listed honestly as a limitation, not hidden.</p>
</section>

<section class="tab">
<h2>How People Can Actually Use This</h2>
<div class="card">
<h3>This is not just a learning exercise — here's who it's actually for</h3>
<ul>
<li><strong>A lightweight home/lab network monitor.</strong> Run it on a Linux box at the edge of a small network (a home lab, a student hostel network, a Raspberry Pi) to get a free, dependency-free early warning for port scans and SYN floods, viewable from any browser on the LAN.</li>
<li><strong>A teaching tool for networking courses.</strong> Because every header field is decoded by hand instead of hidden behind Scapy, this is a better classroom artifact than most "packet sniffer" tutorials — a student can trace exactly which bytes become which Python variable.</li>
<li><strong>A blue-team baseline for CTF practice.</strong> Point it at a CTF lab network during an attack-defense round; the JSON alert feed is trivial to pipe into a scoreboard or Slack webhook.</li>
<li><strong>A starting point for IDS research.</strong> The detector classes (<code>ScanDetector</code>, <code>SlowScanDetector</code>, <code>DistributedScanDetector</code>, <code>FloodDetector</code>) are small, independently testable, and designed to be swapped or extended — a natural base for experimenting with new detection heuristics (e.g. the threshold-random-walk idea discussed in Interview Questions) without inheriting a large framework's complexity.</li>
<li><strong>A portable incident-response companion.</strong> Because it needs no install beyond a Python 3 standard library and runs from a single directory, it can be copied onto a box during an investigation to get immediate visibility without installing Suricata/Zeek.</li>
</ul>
<h3>How to actually run it on your own network</h3>
<pre># 1. find your interface name
ip link

# 2. edit the interface name inside sniffer.py if you don't want the default
#    (grep for AF_PACKET — the socket itself listens on ALL interfaces by
#    default; filter in parse_packet() if you want to scope it to one NIC)

# 3. start the sniffer (needs root for the raw socket)
sudo python3 sniffer.py

# 4. in another terminal, serve the dashboard
python3 -m http.server --bind 127.0.0.1 8000

# 5. open http://127.0.0.1:8000/dashboard.html</pre>
<div class="note"><strong>Tuning for your own network:</strong> the detection thresholds (20 ports/10s, 30 ports/10min, 5 sources+30 ports/5min, 100/500 half-open SYNs/5s) are constructor defaults on each detector class in <code>detect.py</code> — e.g. <code>ScanDetector(max_ports=10, window=5)</code> for a more sensitive home setup, or higher numbers for a busier network to cut false alarms. See Testing &amp; Results for the trade-off each threshold represents.</div>
</div>

<div class="card"><h3>60-second pitch</h3>
<p><em>"NetWraith is a packet sniffer and intrusion detector I built from scratch in Python — no Scapy, no frameworks. It opens a raw socket, decodes Ethernet, IPv4, TCP and UDP headers byte by byte with struct.unpack, and runs four detectors over the live traffic: a fast port-scan detector, a slow bucketed one for patient scanners, a distributed one that watches the victim instead of the attacker, and a SYN-flood detector that handles both a single flooding IP and a spoofed, many-IP flood. I validated each detector with fake-packet unit tests first, then with real nmap and hping3 attacks against my own machine — 5 out of 5 floods caught, zero false alarms, and I can show you exactly where it breaks and why."</em></p>

<div class="card"><h3>10 likely questions, answered in my own words</h3>
<div class="qa"><div class="q">Q1. Why did you build this instead of using Scapy or Snort?</div><div class="a">A. The point wasn't to ship a production IDS — it was to understand TCP/IP well enough that I could decode a SYN packet's flag byte with a bitmask and explain why. Using Scapy would have hidden exactly the part I needed to learn.</div></div>
<div class="qa"><div class="q">Q2. Walk me through what happens when a packet arrives.</div><div class="a">A. The raw socket hands me the full frame. I slice off 14 bytes for Ethernet and check the EtherType; if it's 0x0800 (IPv4), I read the next 20+ bytes with struct.unpack, get the IHL to find where TCP/UDP starts, then decode that. The result is a dict that goes to packets.jsonl and to all four detectors.</div></div>
<div class="qa"><div class="q">Q3. How does your port-scan detector work?</div><div class="a">A. For each source IP I keep a sliding 10-second window of SYN-only packets' destination ports in a deque, drop entries older than the window, and alert if the set of distinct ports exceeds 20.</div></div>
<div class="qa"><div class="q">Q4. How is a SYN flood different from a scan in your code?</div><div class="a">A. A scan counts distinct ports per source; a flood counts repeated unanswered SYNs to the same (source, target, port). The same traffic can never trigger both, because one measures breadth and the other measures repetition.</div></div>
<div class="qa"><div class="q">Q5. Why do you ignore RST packets in the flood detector?</div><div class="a">A. When I flood from my own machine with hping3, my own kernel replies RST to the unexpected SYN-ACKs it gets back. If RST cleared my "pending" list, my own test traffic would erase itself and I'd never see the flood. I accepted the cost — counting attempts rather than true server-side half-open state — as the right trade-off for this project.</div></div>
<div class="qa"><div class="q">Q6. What's your biggest known weakness?</div><div class="a">A. Slow, patient scanners can stay under every threshold I have. I mitigated this with a second, longer-window detector, but a sufficiently slow attacker (one probe every 20+ minutes) still escapes both. I'd fix this permanently by scoring connections that never complete, not just counting against a fixed window.</div></div>
<div class="qa"><div class="q">Q7. Why did your sniffer only capture ~3% of packets during the flood test?</div><div class="a">A. Python's single-threaded recv loop can't keep up with ~1.2 million packets in 5 seconds — each packet does a syscall, a struct.unpack, a detector pass and a file write. The detector still worked because it only needs partial visibility to cross its threshold, which I think is actually a good design property to point out, not just a limitation.</div></div>
<div class="qa"><div class="q">Q8. How would you detect a slower, distributed attack?</div><div class="a">A. I built exactly that — DistributedScanDetector groups by target instead of attacker, and alerts when at least 5 distinct sources collectively touch more than 30 ports on one victim within 5 minutes, even if each individual source stays well under the single-source threshold.</div></div>
<div class="qa"><div class="q">Q9. What would you add with more time?</div><div class="a">A. IPv6 support (my own Wi-Fi traffic was mostly IPv6, so the sniffer currently misses most of what it sees there), ARP spoofing detection, and deduplicating overlapping alerts from the fast and slow scan detectors firing on the same attack.</div></div>
<div class="qa"><div class="q">Q10. Why does alerts.json get written to a temp file first?</div><div class="a">A. The dashboard polls that file every 2 seconds. If it read the file mid-write it would get broken JSON. Writing to a temp file and swapping it in with os.replace makes the update atomic, so the dashboard only ever sees a complete old or new version.</div></div>
</div>

<li><strong>Fixed time windows miss patient attackers.</strong> Improvement: score connections by completion rate over a long horizon, not just raw counts in a window.</li>
<li><strong>Only SYN-based TCP scans are detected</strong> — FIN/NULL/Xmas/ACK scans and UDP scans pass through untouched. Improvement: add flag-combination rules for each nmap scan type, and a UDP-specific detector.</li>

<section class="tab">
<h2>Interview Questions (practice set, from our own sessions)</h2>
<p class="small">These are the exact kind of concept-check questions used while building this project, reconstructed as a mock interview. Items marked <span class="tag needs-review">revise before interview</span> are ones where the first answer needed correction — review those again before the real thing.</p>

<div class="qa"><div class="q">What is network byte order, and what does <code>!</code> in <code>struct.unpack</code> do?</div>
<div class="a">Network byte order is big-endian — the most significant byte comes first, which is how every protocol header on the wire is written, regardless of what byte order the local CPU uses internally. <code>!</code> in a <code>struct</code> format string tells it to read/write using that order.</div></div>

<div class="qa"><div class="q">Why do we multiply IHL by 4 to get the IPv4 header length in bytes? <span class="tag needs-review">revise</span></div>
<div class="a">IHL (Internet Header Length) counts the header size in 4-byte words, not bytes — IHL=5 means 5×4=20 bytes. This matters because options can make IHL larger than 5, pushing the start of the TCP/UDP header further into the packet than a naive "always skip 20 bytes" assumption would.</div></div>

<div class="qa"><div class="q">Given a TCP flags byte of <code>0x12</code>, which flags are set?</div>
<div class="a">SYN (0x02) and ACK (0x10) — 0x02 + 0x10 = 0x12. This is the SYN-ACK packet, step 2 of the handshake.</div></div>

<div class="qa"><div class="q">What single bitmask test correctly identifies a "SYN-only" packet (not a SYN-ACK)? <span class="tag needs-review">revise</span></div>
<div class="a"><code>(flags &amp; 0x12) == 0x02</code> — mask down to just the SYN and ACK bits, and the result must be exactly SYN set with ACK clear. Testing <code>flags &amp; 0x02</code> alone is wrong, because it would also be true for a SYN-ACK.</div></div>

<div class="qa"><div class="q">Why do raw sequence numbers in your own sniffer's output look completely different from the ones Wireshark/tshark shows for the same packet?</div>
<div class="a">Wireshark displays <em>relative</em> sequence numbers, starting each stream at 0 for readability. My sniffer prints the real 32-bit value, which starts at a random Initial Sequence Number (ISN) chosen for that connection. Subtracting the stream's own ISN from the raw value reproduces Wireshark's relative numbers exactly.</div></div>

<div class="qa"><div class="q">Why does a TCP connection need three messages to establish, not two?</div>
<div class="a">Each side must prove it can both send and receive. After SYN, the server only knows the client can send. After SYN-ACK, the client knows the server can send and receive. Only after the final ACK does the server know the client can receive too — and both sides have exchanged their starting sequence numbers.</div></div>

<div class="qa"><div class="q">In your scan-vs-flood test, why did a 1000-port SYN scan register as a scan but not as a flood?</div>
<div class="a">The flood detector counts unanswered SYNs per (source, destination, port). A scan sends one SYN per port across 1000 different ports, so no single service ever accumulates more than 1 unanswered SYN — nowhere near the 100 threshold. The scan detector, which counts distinct ports instead, crosses its threshold almost immediately.</div></div>

<div class="qa"><div class="q">Why does <code>write_state()</code> write to <code>alerts.json.&lt;pid&gt;.tmp</code> before renaming it into place? <span class="tag needs-review">revise</span></div>
<div class="a">Two reasons: first, writing straight to <code>alerts.json</code> risks the dashboard reading a half-written file mid-write; <code>os.replace</code> makes the swap atomic. Second, including the process ID in the temp filename means two sniffer instances running by accident can't stomp on each other's temp file mid-write — a real bug I hit and fixed during testing.</div></div>

<div class="qa"><div class="q">Explain, in plain terms, what <code>self.pending[key] = now</code> and the later <code>key in self.pending</code> check actually do together.</div>
<div class="a"><code>key</code> is a tuple of (source IP, source port, destination IP, destination port) that uniquely identifies one connection attempt. Storing <code>now</code> under that key marks "this connection sent a SYN at this time and hasn't been ACKed yet." When the matching ACK arrives, it's built into the same key, found in <code>pending</code>, and removed — completing the handshake from the detector's point of view.</div></div>

<div class="qa"><div class="q">Why does the slow-scan detector use time buckets instead of storing every packet in a long list?</div>
<div class="a">Memory would grow without bound if every packet over a 10-minute window were kept individually. By storing one small <em>set</em> of ports per 1-minute bucket and dropping buckets older than the window, memory per source is capped at a fixed number of buckets no matter how much traffic arrives.</div></div>
</section>

<section class="tab">
<h2>Notes — Concepts Learned</h2>
<p class="small">A running reference of the concepts this project required, written up from the actual explanations and corrections made while building it.</p>

<div class="note"><h3>TCP handshake</h3>
<p>SYN (client picks random ISN) → SYN-ACK (server picks its own ISN, ack = client's ISN+1) → ACK (ack = server's ISN+1). Both SYN and FIN consume one sequence number each, even though they carry no data — that's why the ack after a SYN is ISN+1, not ISN.</p></div>

<div class="note"><h3>Byte order</h3>
<p>Network protocols always use big-endian ("network byte order"). x86 CPUs store numbers little-endian internally. <code>struct.unpack("!H", ...)</code> and <code>socket.ntohs()</code> both exist purely to bridge that gap.</p></div>

<div class="note"><h3>Flag bitmasks</h3>
<p>FIN=0x01, SYN=0x02, RST=0x04, PSH=0x08, ACK=0x10. To test "exactly these flags and no others relevant to the check," mask first with the OR of all the bits you care about, then compare to the exact pattern you want — testing a single bit alone is a common and subtle bug (it would match SYN-ACK when you only wanted a bare SYN).</p></div>

<div class="note"><h3>IHL and variable header length</h3>
<p>The IPv4 header's own length field (IHL) is necessary because the header can be larger than 20 bytes when options are present — you cannot assume TCP/UDP always starts at a fixed offset.</p></div>

<div class="note"><h3><code>deque</code> vs plain list</h3>
<p>A <code>deque</code> gives O(1) <code>append()</code>/<code>popleft()</code>, which matters because a sliding-window detector constantly adds to one end and trims from the other — a plain list's <code>pop(0)</code> is O(n) and gets slower as the queue grows.</p></div>

<div class="note"><h3><code>defaultdict</code></h3>
<p><code>defaultdict(deque)</code> auto-creates an empty deque the first time a new key (source IP) is seen, avoiding a manual "if key not in dict: dict[key] = []" check before every append.</p></div>

<div class="note"><h3><code>Counter</code> and <code>dict.get(key, default)</code></h3>
<p><code>Counter</code> treats a missing key as 0, so <code>counter[k] += 1</code> works even the first time. <code>dict.get(k, default)</code> reads a value without raising <code>KeyError</code> if the key is absent — used throughout for cool-down timestamps that may not exist yet.</p></div>

<div class="note"><h3>Tuples as dictionary keys</h3>
<p>Tuples are immutable, so they're hashable and safe to use as dict keys; lists are not. This project keys state by tuples like <code>(source, destination, port)</code> to bundle several facts into one lookup.</p></div>

<div class="note"><h3>List comprehension with a filter: <code>[a for a in (...) if a]</code></h3>
<p>Reads as "keep <code>a</code>, for each <code>a</code> produced by the generator, only if <code>a</code> is truthy." Used throughout the test files to collect only the real alerts a detector produced, discarding the many <code>None</code> results.</p></div>

<div class="note"><h3>Atomic file writes</h3>
<p>Writing a new version of a file to a temp path and then <code>os.replace()</code>-ing it into place is the standard way to update a file that another process (here, the dashboard's browser-side JS) reads concurrently, without ever exposing a half-written version.</p></div>

<div class="note"><h3>Why RST is deliberately ignored by the flood detector</h3>
<p>If the flood detector cleared a pending SYN on RST, a self-inflicted RST (the attacking machine's own kernel replying to an unsolicited SYN-ACK) would hide the attack from its own detector. The chosen definition — "unanswered SYN attempts" rather than "true server-side half-open count" — is a deliberate trade-off, not an oversight.</p></div>
</section>

<section class="tab">
<h2>Glossary</h2>
<table>
<tr><td><strong>Packet</strong></td><td>A chunk of data sent over a network, wrapped in header "envelopes" at each layer.</td></tr>
<tr><td><strong>Ethernet header</strong></td><td>14-byte envelope: destination MAC, source MAC, EtherType.</td></tr>
<tr><td><strong>MAC address</strong></td><td>Hardware address identifying a network interface on a local link.</td></tr>
<tr><td><strong>EtherType</strong></td><td>2-byte field saying what's inside the Ethernet frame (0x0800=IPv4, 0x86DD=IPv6, 0x0806=ARP).</td></tr>
<tr><td><strong>IPv4 header</strong></td><td>20+ byte envelope: source/destination IP, protocol, TTL, header length (IHL).</td></tr>
<tr><td><strong>IHL</strong></td><td>Internet Header Length — IPv4 header size in 4-byte words.</td></tr>
<tr><td><strong>TTL</strong></td><td>Time To Live — decremented by each router; packet is dropped at 0.</td></tr>
<tr><td><strong>TCP</strong></td><td>Reliable, connection-based transport protocol (the "phone call").</td></tr>
<tr><td><strong>UDP</strong></td><td>Unreliable, connectionless transport protocol (the "postcard").</td></tr>
<tr><td><strong>Port</strong></td><td>16-bit number identifying which program on a host a packet is for.</td></tr>
<tr><td><strong>SYN / ACK / FIN / RST</strong></td><td>TCP control flags: start, acknowledge, politely close, abruptly reset a connection.</td></tr>
<tr><td><strong>Sequence number (seq)</strong></td><td>Position of a packet's first byte in its stream's byte count.</td></tr>
<tr><td><strong>Half-open connection</strong></td><td>A connection where SYN-ACK was sent but the final ACK never arrived.</td></tr>
<tr><td><strong>Port scan</strong></td><td>Probing many ports on a target to discover which are open.</td></tr>
<tr><td><strong>SYN flood</strong></td><td>Sending many SYNs that are never completed, to exhaust a server's connection table.</td></tr>
<tr><td><strong>Sliding window</strong></td><td>Only counting events from the most recent N seconds, forgetting older ones.</td></tr>
<tr><td><strong>Bucket</strong></td><td>A fixed time slice (e.g. one minute) used to bound memory while covering a long window.</td></tr>
<tr><td><strong>Raw socket</strong></td><td>A socket (<code>AF_PACKET</code>/<code>SOCK_RAW</code>) that delivers packets exactly as they arrived, headers included.</td></tr>
<tr><td><strong>struct.unpack</strong></td><td>Python stdlib function turning raw bytes into typed values per a format string.</td></tr>
<tr><td><strong>Network byte order</strong></td><td>Big-endian — the byte order all network protocols use on the wire.</td></tr>
</table>
</section>
